point_in_time_input_contract:
  fundamental_selection:
    table: stock_fundamental_pit
    availability_filter:
      - announcement_date_lte_signal_trade_date
      - period_end_date_lte_signal_trade_date
    row_order:
      - period_end_date_desc
      - announcement_date_desc
      - update_flag_desc
      - id_desc
    row_choice: first_row_per_code
  lifecycle_table: stock_instrument_lifecycle
  name_status_table: stock_name_history
  suspension_table: stock_suspension_daily
  price_table: daily_kline
  adjustment_table: adj_factor_daily
  daily_market_table: factor_input_daily
  unknown_or_missing_state_policy: fail_closed

eligibility_gates:
  instrument_type: stock
  primary_universe: point_in_time_all_a
  minimum_listing_sessions: 120
  require_known_lifecycle: true
  exclude_st: true
  exclude_delisting_period: true
  exclude_suspended_on_signal_date: true
  require_all_quality_fields:
    - roe
    - roa
    - grossprofit_margin
    - netprofit_margin
    - revenue_yoy
    - profit_yoy
  require_positive_eps: true
  required_price_sessions: 61
  require_complete_adjustment_factors: true
  median_amount_window_sessions: 20
  minimum_median_amount_cny: 50000000
  realized_volatility_window_sessions: 20
  maximum_annualized_realized_volatility: 0.90
  maximum_20_session_drawdown: -0.25
  volatility_role: hard_risk_gate_only_not_positive_score

normalization:
  cross_section: eligible_universe_on_each_signal_date
  winsorization_lower_percentile: 2.5
  winsorization_upper_percentile: 97.5
  transform_after_winsorization: percentile_rank_0_to_100
  rank_direction: higher_is_better
  missing_value_policy: fail_closed_no_imputation_no_weight_renormalization

quality_score:
  weight_in_final_score: 0.60
  factors:
    roe:
      weight: 0.25
    roa:
      weight: 0.15
    grossprofit_margin:
      weight: 0.15
    netprofit_margin:
      weight: 0.15
    revenue_yoy:
      weight: 0.15
    profit_yoy:
      weight: 0.15
  formula: weighted_sum_of_cross_sectional_percentile_ranks

trend_confirmation_and_score:
  weight_in_final_score: 0.40
  adjusted_price_formula: raw_close_times_adj_factor_divided_by_signal_date_adj_factor
  return_20_sessions: adjusted_close_t_div_adjusted_close_t_minus_20_minus_1
  return_60_sessions: adjusted_close_t_div_adjusted_close_t_minus_60_minus_1
  hard_confirmation:
    - return_20_sessions_gt_0
    - return_60_sessions_gt_0
    - adjusted_close_t_gt_adjusted_sma_60
  factors:
    return_20_sessions_percentile:
      weight: 0.50
    return_60_sessions_percentile:
      weight: 0.50
  formula: weighted_sum_of_cross_sectional_percentile_ranks

final_score_and_selection:
  formula: quality_score_times_0_60_plus_trend_score_times_0_40
  minimum_quality_score: 60.0
  minimum_trend_score: 55.0
  minimum_final_score: 70.0
  maximum_picks: 3
  minimum_picks: 0
  allow_cash: true
  force_fill: false
  boundary_score_separation_points: 2.0
  boundary_rule: >-
    Sort qualifying candidates by final score descending. Take at most three, define the
    boundary as the first unselected qualifying score or 70 when none exists, and retain
    only selected candidates whose score is at least 2.0 points above that boundary.
  tie_policy: equal_boundary_scores_are_not_rescued_by_code_order

execution_contract_reference:
  signal_timing: after_t_close
  entry_timing: next_tradable_session_open
  primary_holding_sessions: 5
  rebalance_interval_sessions: 5
  non_overlapping_offsets: [0, 1, 2, 3, 4]
  costs_bps:
    commission_each_side: 3.0
    stamp_tax_sell_side: 5.0
    slippage_each_side: 5.0

implementation_gate:
  status: blocked
  blockers:
    - development_partition_adjustment_factor_coverage_is_zero
    - adjusted_total_return_accounting_must_be_backfilled_and_quality_checked
  forbidden_fallback: raw_unadjusted_return
  next_allowed_work: adjustment_data_design_and_backfill_only
  strategy_code_may_be_created_now: false
  historical_diagnostic_may_run_now: false
  database_validation_protocol_may_be_created_now: false

