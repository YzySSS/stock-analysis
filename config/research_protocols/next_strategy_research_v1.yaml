schema_version: 1

protocol:
  id: next_strategy_research_v1
  kind: preimplementation_research_charter
  status: charter_frozen
  frozen_at: "2026-07-18T16:16:48+08:00"
  frozen_on_commit: dcc24f04913eaaf67521136ba9505f0a0caa1085
  owner: stock-analysis
  immutable: true
  revision_policy: create_a_new_protocol_id_file_and_hash_never_edit_v1

truth_status:
  is_validation_protocol: false
  eligible_for_validation: false
  validation_status: unvalidated
  historical_diagnostic_can_promote: false
  prospective_pass_action: manual_review_candidate_only
  auto_promote: false
  auto_enable_for_selection: false
  auto_make_default: false

research_question:
  hypothesis: >-
    Point-in-time quality signals with medium-term trend confirmation and
    liquidity/risk eligibility constraints can produce a sparse, cost-aware
    stock selection signal that is more stable than the rejected low-volatility
    reversal and V13 three-factor families.
  maximum_picks: 3
  minimum_picks: 0
  allow_cash: true
  force_fill_pick_count: false

candidate_family:
  reserved_strategy_id: pit_quality_trend_liquidity_v1
  independent_from_strategy_ids:
    - lowvol_reversal
    - v13_three_factor
  permitted_signal_groups:
    quality_point_in_time:
      role: scored_signal
      table: stock_fundamental_pit
      allowed_fields:
        - roe
        - roa
        - grossprofit_margin
        - netprofit_margin
        - revenue_yoy
        - profit_yoy
        - eps
      availability_rule: announcement_date_lte_signal_date_and_period_end_lte_signal_date
    medium_term_trend:
      role: confirmation_not_short_term_reversal
      table: daily_kline
      availability_rule: prices_and_volume_lte_signal_date_only
    liquidity_and_risk:
      role: eligibility_and_position_risk_constraints
      availability_rule: point_in_time_market_and_stock_status_only
      volatility_policy: hard_risk_constraint_only_not_positive_lowvol_alpha_score
  forbidden_designs:
    - lowvol_or_reversal_weight_tuning
    - v13_weight_or_threshold_tuning
    - absolute_share_price_alpha_bonus
    - forced_top_n_when_no_signal_qualifies
    - current_fundamentals_on_historical_dates
    - current_name_st_listing_or_suspension_state_on_historical_dates
    - current_index_membership_on_historical_dates
    - best_offset_selection_after_results
    - diagnostic_window_parameter_tuning
    - changing_holding_period_after_results

data_contract:
  primary_universe: ALL_A
  robustness_universe: 000300.SH
  benchmark_index: 000300.SH
  unknown_state_policy: fail_closed
  required_point_in_time_inputs:
    - stock_lifecycle_pit
    - stock_name_status_period
    - stock_suspension_daily_pit
    - stock_fundamental_pit
    - index_constituent_pit_for_index_robustness
    - factor_and_market_rows_as_of_signal_date
  minimum_pit_data_quality_status: ready
  minimum_required_field_coverage_pct: 95.0
  execution_price_basis: raw_open_price
  performance_return_basis: point_in_time_corporate_action_adjusted_total_return
  missing_adjustment_policy: block_implementation_lock

time_partitions:
  development:
    start_date: "2024-01-02"
    end_date: "2025-06-30"
    allowed_use: factor_definition_normalization_and_threshold_selection_only
    can_support_validation_claim: false
  historical_diagnostic:
    start_date: "2025-07-01"
    end_date: "2026-06-30"
    observed_history: true
    allowed_use: reject_or_mark_inconclusive_only
    can_support_validation_claim: false
    tuning_after_observation: forbidden
  embargo:
    start_date: "2026-07-01"
    end_rule: implementation_freeze_data_cutoff_date
    allowed_use: no_training_no_diagnostic_no_validation
  prospective_oos:
    start_rule: >-
      first benchmark trading session strictly after both the implementation
      freeze date and its frozen data cutoff date
    fixed_window_benchmark_sessions: 252
    minimum_complete_signal_days: 240
    early_evaluation: forbidden
    tuning_during_window: forbidden
    rerun_same_protocol_after_failure: forbidden

execution_contract:
  signal_timing: after_t_close_using_only_information_available_by_t_close
  entry_timing: next_tradable_session_open
  exit_timing: scheduled_rebalance_open_or_first_tradable_open_if_blocked
  primary_holding_sessions: 5
  rebalance_interval_sessions: 5
  non_overlapping_offsets:
    - 0
    - 1
    - 2
    - 3
    - 4
  offset_policy: evaluate_all_offsets_and_never_select_the_best_one
  maximum_positions: 3
  allow_empty_portfolio: true
  execution_constraints_enabled: true
  costs_bps:
    commission_each_side: 3.0
    stamp_tax_sell_side: 5.0
    slippage_each_side: 5.0

development_budget:
  maximum_candidate_specs: 12
  log_every_candidate: true
  parameter_search_scope: development_partition_only
  exact_factor_formula_required_before_diagnostic: true
  exact_score_normalization_required_before_diagnostic: true
  exact_entry_threshold_required_before_diagnostic: true
  exact_score_separation_gate_required_before_diagnostic: true
  selected_spec_lock_artifact: factor_spec_v1_yaml_plus_sha256
  implementation_lock_artifact: source_config_data_cutoff_and_methodology_fingerprints

evidence_gates:
  structural:
    minimum_complete_signal_days: 240
    minimum_benchmark_coverage_pct: 98.0
    minimum_completed_positions_per_offset: 90
    all_required_pit_checks_pass: true
    configuration_and_source_fingerprints_match: true
    no_missing_or_future_known_fields: true
  performance_net_of_costs:
    minimum_total_return_pct_each_offset: 0.0
    minimum_excess_return_pct_each_offset: 0.0
    minimum_median_offset_sharpe_ratio: 0.5
    maximum_drawdown_floor_pct_each_offset: -20.0
    minimum_positive_excess_quarter_ratio_each_offset: 0.5
    minimum_bootstrap_mean_excess_ci_low_pct_each_offset: 0.0
  turnover_and_stability:
    maximum_average_replacement_ratio_each_offset: 0.5
    all_non_overlapping_offsets_must_pass: true
    robustness_universe_median_excess_return_must_be_nonnegative: true
    robustness_result_cannot_rescue_primary_failure: true
  score_separation:
    required: true
    definition_and_numeric_threshold_lock_stage: factor_spec_lock
    failure_effect: reject_or_inconclusive_never_relax_after_diagnostic

stage_gates:
  - id: charter_lock
    status: completed
    output: this_yaml_and_sha256
  - id: factor_spec_lock
    status: pending
    allowed_data: development_partition_only
    output: immutable_factor_spec_formula_threshold_candidate_log_and_hash
  - id: implementation_lock
    status: pending
    prerequisites:
      - factor_spec_lock_complete
      - adjusted_return_accounting_ready
      - data_quality_ready
      - tests_pass
    output: immutable_source_config_methodology_data_cutoff_and_prospective_dates
  - id: historical_diagnostic
    status: pending
    effect: reject_or_inconclusive_only
    mutation_after_result: requires_new_candidate_and_new_protocol
  - id: prospective_oos
    status: pending
    effect: fail_inconclusive_or_manual_review_candidate
    mutation_after_start: forbidden
  - id: manual_promotion_review
    status: pending
    auto_promotion: forbidden
    required_reviews:
      - data_quality
      - methodology
      - implementation_fingerprint
      - all_offset_results
      - limitations_and_risk

implementation_boundaries:
  create_independent_strategy_id_config_and_files: true
  modify_existing_frozen_strategy_implementation_files: false
  create_database_validation_protocol_now: false
  run_backtest_now: false
  expose_in_ordinary_selection_before_manual_promotion: false
  set_as_default_before_manual_promotion: false
