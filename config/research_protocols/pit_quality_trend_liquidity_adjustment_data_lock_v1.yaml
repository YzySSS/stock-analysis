return_accounting_contract:
  adjusted_total_return_formula: end_price_times_end_factor_divided_by_start_price_times_start_factor_minus_one
  exact_formula: end_price*end_factor/(start_price*start_factor)-1
  adjusted_close_formula: raw_close_times_adj_factor_divided_by_signal_date_adj_factor
  execution_price_policy: use_raw_market_open_for_simulated_execution
  candidate_path_requirement: every_required_price_date_must_have_a_positive_finite_adjustment_factor
  missing_factor_policy: fail_closed_per_candidate_path
  forbidden_fallback: raw_unadjusted_return

