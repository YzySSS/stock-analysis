selection:
  max_picks: 3
  score_threshold: 60

hard_filters:
  min_price: 3
  max_price: 120
  min_amount: 40000000

factors:
  fund_flow:
    name: 资金回流
    category: moneyflow
    direction: positive
    weight: 0.30
    description: 关注主力/大单净流入强度，要求资金开始回补。
  chip_repair:
    name: 筹码修复
    category: chip
    direction: positive
    weight: 0.25
    description: 关注获利盘比例与成本中枢位置，避免过热追高。
  pullback:
    name: 温和回撤
    category: technical
    direction: neutral
    weight: 0.20
    description: 偏好短期温和回撤、靠近均线或成本区的修复形态。
  liquidity:
    name: 流动性
    category: liquidity
    direction: neutral
    weight: 0.15
    description: 换手率适中，排除极端冷门或极端炒作。
  lowvol:
    name: 低波约束
    category: risk
    direction: positive
    weight: 0.10
    description: 波动越低，修复策略的接飞刀风险越小。
