selection:
  max_picks: 5
  score_threshold: 68

allow_limit_up: true

hard_filters:
  min_price: 2
  max_price: 80
  min_realtime_pct: 5
  min_realtime_amount: 200000000
  min_prev_amount: 150000000
  min_prev_divergence_pct: 4

factors:
  divergence:
    name: 分歧强度
    category: emotion
    direction: positive
    weight: 0.22
    description: 昨日冲高回落、振幅与放量共同衡量是否经历充分分歧。
  reversal_strength:
    name: 反包强度
    category: technical
    direction: positive
    weight: 0.25
    description: 今日涨幅、日内低点修复和是否涨停衡量资金回流强度。
  recognition:
    name: 市场辨识度
    category: leadership
    direction: positive
    weight: 0.20
    description: 今日成交额、昨日成交额和市值承载力衡量是否具备情绪龙关注度。
  turnover_heat:
    name: 换手热度
    category: liquidity
    direction: neutral
    weight: 0.12
    description: 高换手是情绪票特征，但过热会降分。
  sentiment_heat:
    name: 题材/人气热度
    category: sentiment
    direction: positive
    weight: 0.13
    description: 个股人气与市场强度作为情绪环境确认。
  risk_control:
    name: 风险约束
    category: risk
    direction: positive
    weight: 0.08
    description: 基本面弱、极端低开、估值不可比等只做风险提示和轻度降权。
