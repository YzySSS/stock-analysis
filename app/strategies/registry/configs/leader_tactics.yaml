selection:
  max_picks: 3
  score_threshold: 60

hard_filters:
  min_amount: 120000000

factors:
  strength:
    name: 强势程度
    category: technical
    direction: positive
    weight: 0.20
    description: 结合当日涨跌幅和相对均线强度，识别阶段强势股。
  volume_confirm:
    name: 放量确认
    category: volume
    direction: neutral
    weight: 0.16
    description: 偏好温和放量，不追极端爆量。
  fund_flow:
    name: 资金确认
    category: moneyflow
    direction: positive
    weight: 0.18
    description: 资金净流入增强龙头可信度。
  leadership:
    name: 龙头辨识度
    category: leadership
    direction: positive
    weight: 0.18
    description: 成交额和市值代表市场关注度与承载能力。
  sentiment:
    name: 舆情热度
    category: sentiment
    direction: positive
    weight: 0.12
    description: 新闻/舆情偏正向时提高题材延续概率。
  market_heat:
    name: 市场热度
    category: market
    direction: positive
    weight: 0.08
    description: 市场环境越强，龙头战法越适用。
  turnover:
    name: 换手健康度
    category: liquidity
    direction: neutral
    weight: 0.08
    description: 偏好健康换手，避免极端一致性过热。
