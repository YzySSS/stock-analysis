selection:
  score_threshold: 50
  max_picks: 3

sentiment_prefetch:
  enabled: true
  candidate_limit: 40
  news_top_n: 10
  max_age_days: 7
  min_credibility: 0.35
  sleep_seconds: 0.1
  skip_existing: false

sentiment_rank:
  v12_weight: 0.8
  sentiment_weight: 0.2

hard_filters:
  min_price: 5
  max_price: 150
  min_amount: 50000000
  exclude_st: true
  min_history_days: 20
  ma20_floor_ratio: 0.9

market_weight_adjustments:
  bull:
    trend: 0.02
    momentum: 0.02
    quality: 0.01
    sentiment: 0.01
    value: -0.02
    liquidity: -0.04
  bear:
    trend: -0.02
    momentum: -0.02
    quality: -0.01
    sentiment: -0.01
    value: 0.02
    liquidity: 0.04

factors:
  trend:
    name: 趋势因子
    category: trend
    description: 当前兼容版用低波动/反转/稳定性近似中期趋势，后续可升级为 MA20 斜率。
    direction: positive
    weight: 0.20
    enabled: true
    ci_hint: 0.08
  momentum:
    name: 动量因子
    category: momentum
    description: 当前兼容版用反转近似阶段强弱，后续可升级为 20 日涨幅。
    direction: positive
    weight: 0.15
    enabled: true
    ci_hint: 0.07
  quality:
    name: 质量因子
    category: quality
    description: 反映盈利质量与财务稳健程度。
    direction: positive
    weight: 0.20
    enabled: true
    ci_hint: 0.05
  sentiment:
    name: 情绪因子
    category: sentiment
    description: 反映市场短期情绪与前一交易日涨跌反馈。
    direction: positive
    weight: 0.15
    enabled: true
    ci_hint: 0.04
  value:
    name: 估值因子
    category: value
    description: 反映估值安全边际，是 V12 中的辅助因子。
    direction: positive
    weight: 0.20
    enabled: true
    ci_hint: 0.06
  liquidity:
    name: 流动性因子
    category: liquidity
    description: 基于最新成交额评估交易活跃度，兼容旧版 V12 的流动性维度。
    direction: positive
    weight: 0.10
    enabled: true
    ci_hint: 0.03
