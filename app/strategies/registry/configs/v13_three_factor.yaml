selection:
  score_threshold: 65
  max_picks: 3

hard_filters:
  min_price: 5
  max_price: 150
  min_avg_amount_20: 50000000
  min_history_days: 20
  require_factor_input: true

factors:
  turnover:
    name: 换手因子
    category: liquidity
    description: 基于最新换手率与量比，偏好温和活跃、不过热的成交状态。
    direction: positive
    weight: 0.35
    enabled: true
    ci_hint: 0.12
  lowvol:
    name: 低波因子
    category: stability
    description: 基于 20 日收盘价区间宽度，波动越温和分数越高。
    direction: positive
    weight: 0.35
    enabled: true
    ci_hint: 0.16
  reversal:
    name: 反转因子
    category: momentum
    description: 基于 20 日涨跌幅，偏好温和回撤后的修复机会，避免追高和深跌陷阱。
    direction: positive
    weight: 0.30
    enabled: true
    ci_hint: 0.10
