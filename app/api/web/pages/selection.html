<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <title>股票分析控制台 - 选股中心</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body data-page="selection">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">股票分析控制台</div>
      <div class="global-stock-search">
        <input data-global-stock-search-input type="text" placeholder="股票代码，如 sh.600000" />
        <button data-global-stock-search-btn class="btn btn-secondary" type="button">查看</button>
      </div>
      <nav class="nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/selection" data-nav="selection">选股中心</a>
        <a href="/tracking" data-nav="tracking">跟踪复盘</a>
        <a href="/strategies" data-nav="strategies">策略管理</a>
        <a href="/system" data-nav="system">数据状态</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Selection</p>
          <h1>选股中心</h1>
          <p class="page-subtitle">这里主要回答“这次选了谁、属于哪套策略、结果后来怎么样”，完整因子分析请去策略管理页看。</p>
        </div>
        <div class="header-actions">
          <button id="refresh-selection-page" class="btn btn-secondary" type="button">刷新页面数据</button>
        </div>
      </header>

      <section class="content-grid two-columns top-align">
        <article class="card">
          <div class="card-header">
            <h2>运行选股</h2>
          </div>

          <form id="selection-form" class="stack-form">
            <div class="form-group">
              <label for="strategy-id">策略</label>
              <select id="strategy-id"></select>
            </div>

            <div class="form-group">
              <label for="instrument-type">股票池类型</label>
              <select id="instrument-type">
                <option value="stock">股票</option>
                <option value="etf">ETF</option>
                <option value="index">指数</option>
              </select>
            </div>

            <div class="form-group">
              <label for="limit">数量限制</label>
              <input id="limit" type="number" value="3" min="1" max="100" />
            </div>

            <div class="form-group">
              <label for="selection-min-score">最低分筛选</label>
              <input id="selection-min-score" type="number" value="60" min="0" max="100" step="1" />
            </div>

            <div class="actions">
              <button class="btn btn-primary" type="submit">运行并保存</button>
              <button id="refresh-strategies" class="btn btn-secondary" type="button">刷新策略</button>
            </div>
          </form>
        </article>

        <article class="card">
          <div class="card-header with-actions">
            <div>
              <h2>当前策略摘要</h2>
              <p class="muted" id="selection-top-summary">加载中...</p>
            </div>
            <div class="actions">
              <a class="btn btn-secondary" href="/strategies">去看策略因子分析</a>
            </div>
          </div>
          <div id="strategy-summary" class="list-stack empty-state">加载中...</div>
        </article>
      </section>

      <section class="card">
        <div class="card-header with-actions">
          <div>
            <h2>选股结果</h2>
            <p class="muted" id="selection-summary-line">加载中...</p>
          </div>
          <div class="actions">
            <button id="refresh-results" class="btn btn-secondary" type="button">刷新结果</button>
          </div>
        </div>
        <form id="selection-filter-form" class="inline-form selection-filter-form">
          <div class="form-group">
            <label for="selection-run-id">run_id / 留空取最新</label>
            <input id="selection-run-id" type="text" placeholder="如 selection_20260427_122725" />
          </div>
          <div class="form-group">
            <label for="selection-search">搜索股票</label>
            <input id="selection-search" type="text" placeholder="代码 / 名称 / 行业 / 策略" />
          </div>
          <div class="form-group">
            <label for="selection-sort">排序方式</label>
            <select id="selection-sort">
              <option value="rank_asc">按排名升序</option>
              <option value="score_desc">按总分降序</option>
              <option value="change_desc">按涨跌幅降序</option>
              <option value="change_asc">按涨跌幅升序</option>
              <option value="name_asc">按名称升序</option>
            </select>
          </div>
          <div class="form-group">
            <label for="selection-industry">行业筛选</label>
            <select id="selection-industry">
              <option value="">全部行业</option>
            </select>
          </div>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>股票</th>
                <th>选股策略</th>
                <th>行业</th>
                <th>选股日期</th>
                <th>入选价</th>
                <th>最新价</th>
                <th>区间涨跌幅</th>
                <th>总分</th>
                <th>排名</th>
                <th>状态</th>
                <th>选股原因</th>
                <th>风险提示</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody id="selection-results-body">
              <tr><td colspan="13" class="muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="card-header with-actions">
          <div>
            <h2>当前页面说明</h2>
          </div>
        </div>
        <div class="note-block">
          <p>选股中心负责展示“这次选了谁、属于哪套策略、后续涨跌和风险如何”；完整因子构成、CI、覆盖率与策略解释链路，统一放到“策略管理”页查看。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/selection.js"></script>
</body>
</html>
