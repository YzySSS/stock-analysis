<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简约版 UI 设计预览 - 股票分析控制台</title>
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
      background: #0b1220;
    }
    .page { width: min(1500px, calc(100vw - 40px)); margin: 0 auto; padding: 24px 0 40px; }
    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid #243041;
      border-radius: 14px;
      background: #111827;
    }
    .eyebrow { margin: 0 0 4px; color: #94a3b8; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.02em; }
    p { margin: 0; color: #94a3b8; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    a { color: #dbeafe; text-decoration: none; border: 1px solid #334155; background: #1f2937; padding: 10px 14px; border-radius: 8px; }
    a.primary { background: #2563eb; border-color: #2563eb; color: white; }
    .preview-card { padding: 14px; border: 1px solid #243041; border-radius: 16px; background: #111827; }
    img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid #243041; background: #0b1220; }
    .note { margin-top: 12px; color: #94a3b8; font-size: 14px; line-height: 1.7; }
    @media (max-width: 780px) { .page { width: calc(100vw - 24px); padding-top: 12px; } .hero { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">MINIMAL GPT-IMAGE-2 UI PREVIEW</p>
        <h1>简约版 UI 设计预览</h1>
        <p>方向：少渐变、少发光、少装饰；保留高信息密度和红绿市场语义。</p>
      </div>
      <div class="actions">
        <a class="primary" href="/ui-reference/pages">返回上一版画廊</a>
        <a href="/stocks/sh.600690">打开真实个股页</a>
      </div>
    </header>

    <section class="preview-card">
      <img src="/static/assets/ui-preview/stock-analysis-ui-simple-gpt-image2.png" alt="gpt-image-2 生成的简约版股票分析控制台 UI 设计预览" />
      <div class="note">如果这个方向更舒服，下一步我会把全站主题从“炫一点的金融大屏”收敛成这种“简约专业工具”：深色底、扁平卡片、细线分隔、只在涨跌/风险/状态上用颜色。</div>
    </section>
  </main>
</body>
</html>
