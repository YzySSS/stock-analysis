<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <title>股票分析控制台 - 跟踪复盘</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body data-page="tracking">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">股票分析控制台</div>
      <div class="global-stock-search">
        <input data-global-stock-search-input type="text" placeholder="股票代码，如 sh.600000" />
        <button data-global-stock-search-btn class="btn btn-secondary" type="button">查看</button>
      </div>
      <nav class="nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/selection" data-nav="selection">选股中心</a>
        <a href="/tracking" data-nav="tracking">跟踪复盘</a>
        <a href="/strategies" data-nav="strategies">策略管理</a>
        <a href="/system" data-nav="system">数据状态</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Tracking</p>
          <h1>跟踪复盘</h1>
        </div>
      </header>

      <section class="stat-grid compact-stats">
        <article class="stat-card">
          <div class="stat-label">复盘条目数</div>
          <div id="tracking-stat-count" class="stat-value">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">仍在跟踪</div>
          <div id="tracking-stat-active-count" class="stat-value">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">平均收益率</div>
          <div id="tracking-stat-avg" class="stat-value">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">胜率</div>
          <div id="tracking-stat-win-rate" class="stat-value">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">超额收益</div>
          <div id="tracking-stat-excess-return" class="stat-value">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">最大浮盈</div>
          <div id="tracking-stat-max-gain" class="stat-value up">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">最大回撤</div>
          <div id="tracking-stat-max-drawdown" class="stat-value down">-</div>
        </article>
      </section>

      <section class="card">
        <div class="card-header with-actions">
          <div>
            <h2>查询条件</h2>
          </div>
        </div>
        <form id="tracking-filter-form" class="inline-form">
          <div class="form-group">
            <label for="tracking-run-id">临时 run_id（排查用）</label>
            <input id="tracking-run-id" type="text" placeholder="一般不用填；留空看持久化复盘结果" />
          </div>
          <div class="form-group small-field">
            <label for="tracking-limit">limit</label>
            <input id="tracking-limit" type="number" value="20" min="1" max="200" />
          </div>
          <div class="form-group small-field">
            <label for="tracking-instrument-type">类型</label>
            <select id="tracking-instrument-type">
              <option value="stock">股票</option>
              <option value="etf">ETF</option>
              <option value="index">指数</option>
            </select>
          </div>
          <div class="actions align-end">
            <button class="btn btn-primary" type="submit">查询</button>
            <button id="tracking-latest-btn" class="btn btn-secondary" type="button">查看当前复盘池</button>
            <button id="tracking-delete-btn" class="btn btn-danger" type="button">删除当前这轮复盘</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>复盘概览</h2>
          <p id="tracking-summary-text" class="muted">正在加载...</p>
        </div>
        <div id="tracking-review-summary" class="list-stack empty-state">加载中...</div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>复盘备注 / 成败归因</h2>
        </div>
        <div id="tracking-review-notes" class="note-block">加载中...</div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>个股复盘列表</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>股票</th>
                <th>选股日期</th>
                <th>入选价</th>
                <th>最新价</th>
                <th>区间收益</th>
                <th>超额收益</th>
                <th>跟踪天数</th>
                <th>最大浮盈</th>
                <th>最大回撤</th>
                <th>状态</th>
                <th>复盘备注</th>
              </tr>
            </thead>
            <tbody id="tracking-results-body">
              <tr><td colspan="11" class="muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js?v=20260428d"></script>
  <script src="/static/js/tracking.js?v=20260429e"></script>
</body>
</html>
