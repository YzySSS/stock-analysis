<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <title>股票分析控制台 - 跟踪复盘</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body data-page="tracking">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">股票分析控制台</div>
      <div class="global-stock-search">
        <input data-global-stock-search-input type="text" placeholder="股票代码，如 sh.600000" />
        <button data-global-stock-search-btn class="btn btn-secondary" type="button">查看</button>
      </div>
      <nav class="nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/selection" data-nav="selection">选股中心</a>
        <a href="/tracking" data-nav="tracking">跟踪复盘</a>
        <a href="/strategies" data-nav="strategies">策略管理</a>
        <a href="/system" data-nav="system">系统状态</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Tracking</p>
          <h1>跟踪复盘</h1>
        </div>
      </header>

      <section class="stat-grid compact-stats">
        <article class="stat-card">
          <div class="stat-label">条目数</div>
          <div id="tracking-stat-count" class="stat-value">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">上涨数</div>
          <div id="tracking-stat-up" class="stat-value up">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">下跌数</div>
          <div id="tracking-stat-down" class="stat-value down">-</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">平均涨跌幅</div>
          <div id="tracking-stat-avg" class="stat-value">-</div>
        </article>
      </section>

      <section class="card">
        <div class="card-header with-actions">
          <div>
            <h2>查询条件</h2>
          </div>
        </div>
        <form id="tracking-filter-form" class="inline-form">
          <div class="form-group">
            <label for="tracking-run-id">run_id</label>
            <input id="tracking-run-id" type="text" placeholder="为空则取最新" />
          </div>
          <div class="form-group small-field">
            <label for="tracking-limit">limit</label>
            <input id="tracking-limit" type="number" value="20" min="1" max="200" />
          </div>
          <div class="form-group small-field">
            <label for="tracking-instrument-type">类型</label>
            <select id="tracking-instrument-type">
              <option value="stock">stock</option>
              <option value="etf">etf</option>
              <option value="index">index</option>
            </select>
          </div>
          <div class="actions align-end">
            <button class="btn btn-primary" type="submit">查询</button>
            <button id="tracking-latest-btn" class="btn btn-secondary" type="button">查看最新</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>跟踪结果</h2>
          <p id="tracking-summary-text" class="muted">正在加载...</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>代码</th>
                <th>名称</th>
                <th>选股日期</th>
                <th>策略</th>
                <th>分数</th>
                <th>开盘价</th>
                <th>现价</th>
                <th>涨跌幅</th>
              </tr>
            </thead>
            <tbody id="tracking-results-body">
              <tr><td colspan="8" class="muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/tracking.js"></script>
</body>
</html>
