<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <title>股票分析控制台 - 数据状态</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body data-page="system">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">股票分析控制台</div>
      <div class="global-stock-search">
        <input data-global-stock-search-input type="text" placeholder="股票代码，如 sh.600000" />
        <button data-global-stock-search-btn class="btn btn-secondary" type="button">查看</button>
      </div>
      <nav class="nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/selection" data-nav="selection">选股中心</a>
        <a href="/tracking" data-nav="tracking">跟踪复盘</a>
        <a href="/strategies" data-nav="strategies">策略管理</a>
        <a href="/system" data-nav="system">系统状态</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Data Status</p>
          <h1>数据状态</h1>
        </div>
        <div class="header-actions">
          <button id="refresh-system-page" class="btn btn-secondary" type="button">刷新状态</button>
        </div>
      </header>

      <section class="content-grid two-columns">
        <article class="card">
          <div class="card-header">
            <h2>健康检查</h2>
          </div>
          <div id="system-health-panel" class="status-panel">加载中...</div>
        </article>

        <article class="card">
          <div class="card-header">
            <h2>数据覆盖率</h2>
          </div>
          <div id="system-coverage-panel" class="status-panel">加载中...</div>
        </article>
      </section>

      <section class="content-grid two-columns">
        <article class="card">
          <div class="card-header">
            <h2>最近同步结果</h2>
          </div>
          <div id="system-latest-panel" class="status-panel">加载中...</div>
        </article>

        <article class="card">
          <div class="card-header">
            <h2>缺口提示</h2>
          </div>
          <div id="system-gap-panel" class="status-panel">加载中...</div>
        </article>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>数据状态说明</h2>
        </div>
        <div class="note-block">
          <p>本页已按 V1 方向承接数据覆盖率、最近同步时间、关键表规模与缺口提示；后续再补异常任务状态、字段级缺失统计与手动触发能力。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/system.js"></script>
</body>
</html>
