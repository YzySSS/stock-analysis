<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>股票分析控制台 - 首页</title>
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body data-page="home">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">股票分析控制台</div>
      <div class="global-stock-search">
        <input data-global-stock-search-input type="text" placeholder="股票代码，如 sh.600000" />
        <button data-global-stock-search-btn class="btn btn-secondary" type="button">查看</button>
      </div>
      <nav class="nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/selection" data-nav="selection">选股中心</a>
        <a href="/tracking" data-nav="tracking">跟踪复盘</a>
        <a href="/strategies" data-nav="strategies">策略管理</a>
        <a href="/system" data-nav="system">数据状态</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h1>首页概览</h1>
        </div>
        <div class="header-actions">
          <a class="btn btn-primary" href="/selection">去运行选股</a>
        </div>
      </header>

      <section class="stat-grid compact-stats">
        <article class="stat-card">
          <div class="stat-label">API 状态</div>
          <div id="home-health-status" class="stat-value">加载中...</div>
          <div id="home-health-detail" class="muted">正在获取健康检查结果</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">默认策略</div>
          <div id="home-default-strategy" class="stat-value">加载中...</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">最新交易日</div>
          <div id="home-latest-trade-date" class="stat-value">加载中...</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">最近跟踪数量</div>
          <div id="home-tracking-count" class="stat-value">加载中...</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">平均涨跌幅</div>
          <div id="home-avg-change" class="stat-value">加载中...</div>
        </article>
      </section>

      <section class="content-grid two-columns">
        <article class="card">
          <div class="card-header">
            <h2>快捷入口</h2>
          </div>
          <div class="quick-links">
            <a class="quick-link-card" href="/selection">
              <strong>运行选股</strong>
              <span>执行策略、查看本轮输出</span>
            </a>
            <a class="quick-link-card" href="/tracking">
              <strong>跟踪复盘</strong>
              <span>查看已入选股票后续表现</span>
            </a>
            <a class="quick-link-card" href="/strategies">
              <strong>策略管理</strong>
              <span>看策略列表、默认策略和描述</span>
            </a>
            <a class="quick-link-card" href="/system">
              <strong>数据状态</strong>
              <span>确认数据覆盖、字段缺口和同步时间</span>
            </a>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <h2>最近跟踪预览</h2>
          </div>
          <div id="home-tracking-preview" class="preview-list">
            <div class="empty-state">加载中...</div>
          </div>
        </article>
      </section>

      <section class="content-grid two-columns">
        <article class="card">
          <div class="card-header">
            <h2>最近一次选股摘要</h2>
          </div>
          <div id="home-selection-summary" class="list-stack empty-state">加载中...</div>
        </article>

        <article class="card">
          <div class="card-header">
            <h2>数据补充状态</h2>
          </div>
          <div id="home-data-status" class="list-stack empty-state">加载中...</div>
        </article>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/home.js"></script>
</body>
</html>
