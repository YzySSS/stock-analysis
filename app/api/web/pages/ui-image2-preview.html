<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gpt-image-2 UI 设计预览 - 股票分析控制台</title>
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5eefb;
      background:
        radial-gradient(circle at 12% 0%, rgba(14, 116, 144, 0.22), transparent 30%),
        radial-gradient(circle at 82% 8%, rgba(37, 99, 235, 0.16), transparent 28%),
        linear-gradient(180deg, #07111f 0%, #050b14 100%);
    }
    .page {
      width: min(1500px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }
    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid rgba(33, 52, 79, 0.72);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(12, 28, 48, 0.72), rgba(7, 17, 31, 0.18));
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
    }
    .eyebrow {
      margin: 0 0 4px;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 36px); letter-spacing: -.03em; }
    p { margin: 0; color: #8fa3bd; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    a {
      color: #dbeafe;
      text-decoration: none;
      border: 1px solid #21344f;
      background: #13243b;
      padding: 10px 14px;
      border-radius: 10px;
    }
    a.primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); border-color: transparent; color: white; }
    .preview-card {
      padding: 16px;
      border: 1px solid #21344f;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(18, 34, 56, 0.92), rgba(10, 20, 35, 0.94));
      box-shadow: 0 22px 70px rgba(0,0,0,.35);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: #0b1220;
    }
    .note {
      margin-top: 12px;
      color: #8fa3bd;
      font-size: 14px;
      line-height: 1.7;
    }
    @media (max-width: 780px) {
      .page { width: calc(100vw - 24px); padding-top: 12px; }
      .hero { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">GPT-IMAGE-2 UI PREVIEW</p>
        <h1>股票分析控制台 UI 设计预览</h1>
        <p>这是 gpt-image-2 生成的视觉方向图，用来讨论页面风格，不是当前真实页面截图。</p>
      </div>
      <div class="actions">
        <a class="primary" href="/stocks/sh.600690">打开当前真实个股页</a>
        <a href="/ui-reference/stock-detail">查看 HTML 参考稿</a>
      </div>
    </header>

    <section class="preview-card">
      <img src="/static/assets/ui-preview/stock-analysis-ui-gpt-image2.png" alt="gpt-image-2 生成的股票分析控制台 UI 设计预览" />
      <div class="note">建议看整体感觉：信息层级、图表卡片、颜色、密度、新闻卡片样式。具体文字和数值不作为真实数据。</div>
    </section>
  </main>
</body>
</html>
