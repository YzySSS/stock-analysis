<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>登录 - 股票分析台</title>
<link rel="icon" type="image/png" href="/favicon.ico?v=20260729brand1"/>
<link rel="apple-touch-icon" href="/static/assets/stock-research-apple-touch.png?v=20260729brand1"/>
<link rel="stylesheet" href="/static/css/base.css"/>
<link rel="stylesheet" href="/static/css/login.css?v=20260723a1"/>
<link rel="stylesheet" href="/static/css/brand.css?v=20260729brand1"/>

<meta name="theme-color" content="#0B1018"/>
<link rel="stylesheet" href="/static/css/dark-design.css?v=20261113dark3"/>
</head>
<body data-page="login" data-ui="dark-v1">
<main class="login-shell">
<section class="login-intro" aria-labelledby="login-title">
<div class="login-brand">
<span class="login-brand-mark" aria-hidden="true">Y</span>
<div>
<strong>股票分析台</strong>
<small>研究工作台</small>
</div>
</div>
<div class="login-copy">
<p class="login-eyebrow">STOCK RESEARCH WORKSPACE</p>
<h1 id="login-title">让研究有据，<br/>让决策有序。</h1>
<p>市场观察 · 策略研究 · 跟踪复盘</p>
</div>
<div class="login-signal" aria-hidden="true">
<span></span><span></span><span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span><span></span><span></span>
</div>
<p class="login-research-note">独立研究，有据可循。<span>仅限授权访问</span></p></section>
<section class="login-panel" aria-label="登录表单">
<form id="login-form" class="login-card" novalidate="">
<div class="login-card-head">
<span class="login-status-dot" aria-hidden="true"></span>
<span>授权访问</span>
</div>
<h2>欢迎回来</h2>
<p class="login-card-desc">登录你的股票研究工作台</p>
<label class="login-field">
<span>用户名</span>
<input id="login-username" name="username" type="text" autocomplete="username" maxlength="64" required="" autofocus=""/>
</label>
<label class="login-field">
<span>密码</span>
<span class="login-password-wrap">
<input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="1024" required=""/>
<button id="login-password-toggle" type="button" aria-label="显示密码">显示</button>
</span>
</label>
<div id="login-message" class="login-message" role="alert" aria-live="polite"></div>
<button id="login-submit" class="login-submit" type="submit">
<span>登录</span>
<span aria-hidden="true">→</span>
</button>
<p class="login-footnote">会话 7 天后自动过期；在公共设备上使用完请主动退出。</p>
</form>
</section>
</main>
<script src="/static/js/login.js?v=20260723a1" defer=""></script>
</body>
</html>
