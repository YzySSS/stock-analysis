<body data-page="login" data-ui="dark-v1">
<main class="login-shell">
<section aria-labelledby="login-title" class="login-intro">
<div class="login-brand">
<span aria-hidden="true" class="login-brand-mark"><svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="m3 26 11-6v21L3 47Z" fill="#3979EF"></path><path d="m18 18 11-6v23l-11 6Z" fill="#568BFA"></path><path d="m33 9 11-6v23l-11 6Z" fill="#7BA6FF"></path></svg></span>
<div>
<strong>股票分析台</strong>
<small>研究工作台</small>
</div>
</div>
<div class="login-copy">
<h1 id="login-title">让研究有据，<br/>让决策有序。</h1>
<p>市场观察 · 策略研究 · 跟踪复盘</p>
</div>
<div aria-hidden="true" class="login-signal"><svg role="presentation" viewBox="0 0 720 240"><defs><pattern height="48" id="login-grid" patternunits="userSpaceOnUse" width="72"><path d="M72 0H0V48" fill="none" stroke="#263445" stroke-width="1"></path></pattern></defs><rect fill="url(#login-grid)" height="240" width="720"></rect><path d="M0 200 75 154 140 183 222 135 260 135 310 97 375 126 452 93 495 59 580 90 662 26 720 4" fill="none" stroke="#668EBF" stroke-width="1.5"></path><path d="M0 228 96 186 155 205 255 164 292 182 380 153 452 178 495 144 548 155 605 116 668 133 720 111" fill="none" stroke="#36516F" stroke-width="1.5"></path></svg></div>
<p class="login-research-note">独立研究，有据可循。<span>仅限授权访问</span></p></section>
<section aria-label="登录表单" class="login-panel">
<form class="login-card" id="login-form" novalidate="">
<h2>欢迎回来</h2>
<p class="login-card-desc">登录你的股票研究工作台</p>
<label class="login-field">
<span>用户名</span>
<input autocomplete="username" autofocus="" id="login-username" maxlength="64" name="username" required="" type="text"/>
</label>
<label class="login-field">
<span>密码</span>
<span class="login-password-wrap">
<input autocomplete="current-password" id="login-password" maxlength="1024" name="password" required="" type="password"/>
<button aria-label="显示密码" id="login-password-toggle" type="button"><svg aria-hidden="true" class="ui-icon" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Zm13 0a3 3 0 1 0-6 0 3 3 0 0 0 6 0"></path></svg></button>
</span>
</label>
<div aria-live="polite" class="login-message" id="login-message" role="alert"></div>
<button class="login-submit" id="login-submit" type="submit"><span>登录</span></button>
<p class="login-footnote">会话 7 天后自动过期；在公共设备上使用完请主动退出。</p>
</form>
</section>
</main>
<script defer="" src="/static/js/login.js?v=20260723a1&amp;ui=20261113fidelity2"></script>
