<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <title>股票分析控制台 - 策略管理</title>
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body data-page="strategies">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">股票分析控制台</div>
      <div class="global-stock-search">
        <input data-global-stock-search-input type="text" placeholder="股票代码，如 sh.600000" />
        <button data-global-stock-search-btn class="btn btn-secondary" type="button">查看</button>
      </div>
      <nav class="nav">
        <a href="/" data-nav="home">首页</a>
        <a href="/selection" data-nav="selection">选股中心</a>
        <a href="/tracking" data-nav="tracking">跟踪复盘</a>
        <a href="/strategies" data-nav="strategies">策略管理</a>
        <a href="/system" data-nav="system">数据状态</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Strategies</p>
          <h1>策略管理</h1>
        </div>
        <div class="header-actions">
          <button id="refresh-strategies-page" class="btn btn-secondary" type="button">刷新策略</button>
        </div>
      </header>

      <section class="stat-grid compact-stats">
        <article class="stat-card">
          <div class="stat-label">默认策略</div>
          <div id="strategies-default" class="stat-value">加载中...</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">策略数量</div>
          <div id="strategies-count" class="stat-value">加载中...</div>
        </article>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>策略列表</h2>
        </div>
        <div id="strategies-list" class="strategy-grid empty-state">加载中...</div>
      </section>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/strategies.js"></script>
</body>
</html>
