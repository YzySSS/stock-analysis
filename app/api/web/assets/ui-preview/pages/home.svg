  <text x="804" y="300" class="muted xs">2026-05-22 11:30:01</text>

  <rect x="238" y="336" width="356" height="230" rx="8" class="panel2"/>
  <text x="258" y="370" class="h2 text">资金强势板块</text>
  <text x="486" y="370" class="muted xs">净流入 / 领涨</text>
  <line x1="258" y1="390" x2="574" y2="390" class="line"/>
  <text x="258" y="424" class="red small">01 机器人概念</text><text x="442" y="424" class="red small">+52.6亿</text><text x="514" y="424" class="muted xs">达实智能</text>
  <text x="258" y="468" class="red small">02 AI算力</text><text x="442" y="468" class="red small">+31.4亿</text><text x="514" y="468" class="muted xs">京东方A</text>
  <text x="258" y="512" class="red small">03 半导体</text><text x="442" y="512" class="red small">+27.9亿</text><text x="514" y="512" class="muted xs">晶方科技</text>
  <text x="258" y="546" class="muted xs">保持原首页板块资金位置，下面新增短线情绪观察</text>

  <rect x="610" y="336" width="356" height="230" rx="8" class="panel2"/>
  <text x="630" y="370" class="h2 text">资金弱势板块</text>
  <text x="842" y="370" class="muted xs">净流出 / 防守</text>
  <line x1="630" y1="390" x2="946" y2="390" class="line"/>
  <text x="630" y="424" class="green small">01 银行</text><text x="820" y="424" class="green small">-18.2亿</text><text x="884" y="424" class="muted xs">降温</text>
  <text x="630" y="468" class="green small">02 白酒</text><text x="820" y="468" class="green small">-12.7亿</text><text x="884" y="468" class="muted xs">回撤</text>
  <text x="630" y="512" class="green small">03 电力</text><text x="820" y="512" class="green small">-9.4亿</text><text x="884" y="512" class="muted xs">震荡</text>

  <rect x="238" y="590" width="356" height="236" rx="8" class="panel2"/>
  <text x="258" y="624" class="h2 text">短线情绪观察</text>
  <text x="258" y="648" class="muted small">新增模块，放在资金强势板块下方</text>
  <rect x="258" y="668" width="72" height="24" rx="7" class="chipRed"/><text x="274" y="684" class="red xs">连板池</text>
  <rect x="336" y="668" width="108" height="24" rx="7" class="chip"/><text x="352" y="684" class="muted xs">分歧反包观察</text>
  <line x1="258" y1="710" x2="574" y2="710" class="line"/>
  <text x="258" y="738" class="text small">达实智能</text><text x="338" y="738" class="muted xs">3板 · 机器人</text><text x="484" y="738" class="red xs">反包涨停</text>
  <text x="258" y="764" class="muted xs">昨日分歧 15.3% · 今日 +10.1% · 换手 46.2%</text>
  <line x1="258" y1="780" x2="574" y2="780" class="line"/>
  <text x="258" y="808" class="text small">四方达</text><text x="338" y="808" class="muted xs">2板 · 培育钻石</text><text x="484" y="808" class="red xs">封板中</text>

  <rect x="610" y="590" width="356" height="236" rx="8" class="panel2"/>
  <text x="630" y="624" class="h2 text">最近跟踪预览</text>
  <text x="842" y="624" class="muted xs">收益 / 状态</text>
  <line x1="630" y1="646" x2="946" y2="646" class="line"/>
  <text x="630" y="680" class="text small">京东方A</text><text x="728" y="680" class="muted xs">舆情观察</text><text x="884" y="680" class="green small">-2.6%</text>
  <rect x="630" y="696" width="280" height="6" rx="3" fill="#1e293b"/><rect x="630" y="696" width="84" height="6" rx="3" fill="#22c55e"/>
  <text x="630" y="736" class="text small">达实智能</text><text x="728" y="736" class="muted xs">情绪反包</text><text x="884" y="736" class="red small">+10.1%</text>
  <rect x="630" y="752" width="280" height="6" rx="3" fill="#1e293b"/><rect x="630" y="752" width="242" height="6" rx="3" fill="#ef4444"/>
  <text x="630" y="792" class="text small">晶方科技</text><text x="728" y="792" class="muted xs">连板观察</text><text x="884" y="792" class="red small">+6.7%</text>

  <text x="238" y="864" class="muted small">设计说明：不重做首页结构，只在资金强势板块下补一个轻量观察模块，作为盘中情绪雷达。</text>
</svg>
