<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .bg{fill:#070d14}.sidebar{fill:#09111a}.panel{fill:#101923;stroke:#263444;stroke-width:1}.panel2{fill:#0d151e;stroke:#243242;stroke-width:1}
      .line{stroke:#263444;stroke-width:1}.muted{fill:#8da0b3}.text{fill:#e7eef7}.red{fill:#ef4444}.green{fill:#22c55e}.cyan{fill:#38bdf8}.amber{fill:#f59e0b}
      .chip{fill:#172333;stroke:#2c3b4e;stroke-width:1}.chipRed{fill:#35171c;stroke:#7f1d1d}.chipGreen{fill:#10291c;stroke:#166534}.chipAmber{fill:#332514;stroke:#92400e}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
      .h1{font-size:30px;font-weight:800}.h2{font-size:18px;font-weight:800}.h3{font-size:15px;font-weight:750}.small{font-size:12px}.xs{font-size:10px}.num{font-size:26px;font-weight:850}.nav{font-size:14px;font-weight:650}
    </style>
  </defs>
  <rect class="bg" width="1024" height="1024"/>
  <rect x="0" y="0" width="184" height="1024" class="sidebar"/>
  <text x="24" y="44" class="text" font-size="18" font-weight="800">股票分析控制台</text>
  <rect x="18" y="82" width="148" height="36" rx="8" fill="#142235" stroke="#28405b"/>
  <text x="34" y="105" class="cyan nav">首页</text>
  <text x="34" y="154" class="muted nav">选股中心</text>
  <text x="34" y="202" class="muted nav">跟踪复盘</text>
  <text x="34" y="250" class="muted nav">回测中心</text>
  <text x="34" y="298" class="muted nav">选股策略</text>
  <text x="34" y="346" class="muted nav">数据状态</text>
  <line x1="184" y1="0" x2="184" y2="1024" class="line"/>

  <text x="218" y="54" class="h1 text">首页</text>
  <text x="218" y="82" class="muted" font-size="15">市场概览 / 板块资金 / 最近跟踪</text>
  <rect x="798" y="34" width="88" height="32" rx="8" fill="#1f2d3d" stroke="#34465c"/><text x="817" y="55" class="text small">查看复盘</text>
  <rect x="896" y="34" width="90" height="32" rx="8" fill="#123047" stroke="#2563eb"/><text x="912" y="55" class="cyan small">运行选股</text>

  <rect x="218" y="110" width="768" height="792" rx="10" class="panel"/>
  <text x="238" y="148" class="h2 text">市场与最近跟踪</text>
  <text x="238" y="172" class="muted small">延续现有首页：市场概览、板块资金、最近跟踪；仅在资金强势板块下方增加短线情绪观察</text>

  <rect x="238" y="202" width="168" height="108" rx="8" class="panel2"/>
  <text x="258" y="230" class="muted small">市场强度</text><text x="258" y="270" class="num red">36.2</text>
  <rect x="258" y="286" width="112" height="7" rx="4" fill="#1e293b"/><rect x="258" y="286" width="41" height="7" rx="4" fill="#ef4444"/>
  <text x="258" y="304" class="muted xs">弱修复 · 额加权 -0.4%</text>

  <rect x="420" y="202" width="168" height="108" rx="8" class="panel2"/>
  <text x="440" y="230" class="muted small">涨 / 跌 / 平</text><text x="440" y="270" class="num text">1842 / 3120</text>
  <text x="440" y="300" class="muted xs">平 238 · 样本 5200 只</text>

  <rect x="602" y="202" width="168" height="108" rx="8" class="panel2"/>
  <text x="622" y="230" class="muted small">沪深涨停 / 跌停</text><text x="622" y="270" class="num red">68 / 9</text>
  <text x="622" y="300" class="muted xs">大涨 128 · 大跌 54</text>

  <rect x="784" y="202" width="182" height="108" rx="8" class="panel2"/>
