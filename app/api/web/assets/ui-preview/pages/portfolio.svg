<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="持仓管理页面 UI 预览">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset=".55" stop-color="#0a1321"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111f31"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .bg{fill:url(#bg)}
      .side{fill:#07101c}
      .panel{fill:url(#panel);stroke:#23344f;stroke-width:1.2;filter:url(#shadow)}
      .panel-soft{fill:#0d1a2b;stroke:#20324e;stroke-width:1}
      .line{stroke:#223651;stroke-width:1}
      .grid{stroke:#1a2a42;stroke-width:1;opacity:.72}
      .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#e5eefb}
      .muted{fill:#8fa3bd}
      .faint{fill:#64748b}
      .green{fill:#22c55e}
      .red{fill:#ef4444}
      .yellow{fill:#f59e0b}
      .cyan{fill:#38bdf8}
      .blue{fill:#60a5fa}
      .chip{fill:#112b3d;stroke:#1f6d8a;stroke-width:1}
      .chip-green{fill:#0e2b22;stroke:#1f7a4c;stroke-width:1}
      .chip-red{fill:#34161b;stroke:#8a2b36;stroke-width:1}
      .tiny{font-size:18px}
      .small{font-size:22px}
      .base{font-size:26px}
      .mid{font-size:32px;font-weight:700}
      .title{font-size:42px;font-weight:800}
      .num{font-family:"SFMono-Regular","Cascadia Mono","Consolas",monospace}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <rect x="0" y="0" width="250" height="1000" class="side"/>
  <rect x="28" y="28" width="54" height="54" rx="14" fill="url(#hot)"/>
  <text x="98" y="52" class="text mid">YZYS</text>
  <text x="98" y="79" class="muted text tiny">Quant Console</text>

  <g class="text small">
    <text x="44" y="150" class="muted">首页</text>
    <text x="44" y="210" class="muted">选股中心</text>
    <text x="44" y="270" class="muted">跟踪复盘</text>
    <rect x="26" y="302" width="198" height="48" rx="12" fill="#12334a" stroke="#1e80a6"/>
    <text x="44" y="333" class="cyan" font-weight="700">持仓管理</text>
    <text x="44" y="398" class="muted">回测中心</text>
    <text x="44" y="458" class="muted">策略管理</text>
    <text x="44" y="518" class="muted">数据状态</text>
  </g>

  <text x="292" y="70" class="text title">持仓管理</text>
  <text x="292" y="108" class="muted text small">Portfolio Monitor · 手动持仓、实时买卖点、策略诊断</text>
  <rect x="1260" y="42" width="270" height="48" rx="14" fill="#0d1d2e" stroke="#243855"/>
  <text x="1280" y="73" class="muted text tiny">实时行情 2026-06-11 14:56:08</text>

  <g transform="translate(292 138)">
    <rect class="panel-soft" x="0" y="0" width="285" height="106" rx="16"/>
    <text x="22" y="34" class="muted text tiny">总市值</text>
    <text x="22" y="76" class="text mid num">128,450</text>
    <text x="190" y="76" class="green text small">+6.9%</text>

    <rect class="panel-soft" x="307" y="0" width="285" height="106" rx="16"/>
    <text x="329" y="34" class="muted text tiny">总盈亏</text>
    <text x="329" y="76" class="green text mid num">+8,320</text>
    <text x="504" y="76" class="muted text small">元</text>

    <rect class="panel-soft" x="614" y="0" width="285" height="106" rx="16"/>
    <text x="636" y="34" class="muted text tiny">今日盈亏</text>
    <text x="636" y="76" class="red text mid num">-1,120</text>
    <text x="812" y="76" class="muted text small">元</text>

    <rect class="panel-soft" x="921" y="0" width="285" height="106" rx="16"/>
    <text x="943" y="34" class="muted text tiny">风险持仓</text>
    <text x="943" y="76" class="yellow text mid num">2</text>
    <text x="982" y="76" class="muted text small">只需处理</text>
  </g>

  <g transform="translate(292 274)">
    <rect class="panel" width="790" height="430" rx="18"/>
    <text x="24" y="44" class="text mid">我的持仓</text>
    <text x="190" y="44" class="muted text tiny">按策略给出下一动作</text>
    <rect x="620" y="18" width="138" height="38" rx="11" fill="#0f2a3d" stroke="#1f6d8a"/>
    <text x="647" y="43" class="cyan text tiny">+ 添加持仓</text>

    <g class="muted text tiny">
      <text x="24" y="95">股票</text><text x="176" y="95">策略</text><text x="298" y="95">成本/现价</text><text x="444" y="95">盈亏</text><text x="560" y="95">建议</text><text x="688" y="95">下一动作</text>
    </g>
    <line x1="22" y1="112" x2="768" y2="112" class="line"/>

    <g transform="translate(0 132)">
      <rect x="18" y="0" width="754" height="64" rx="12" fill="#0f2437" stroke="#27506b"/>
      <text x="28" y="28" class="text small">宗申动力</text><text x="28" y="52" class="faint text tiny">sz.001696</text>
      <rect x="176" y="12" width="92" height="30" rx="15" class="chip-green"/><text x="194" y="33" class="green text tiny">舆情短线</text>
      <text x="302" y="29" class="text tiny num">19.04 / 20.96</text><text x="302" y="53" class="faint text tiny">止损 18.32</text>
      <text x="446" y="40" class="green text small num">+10.08%</text>
      <rect x="560" y="12" width="96" height="30" rx="15" class="chip-green"/><text x="578" y="33" class="green text tiny">继续持有</text>
      <text x="690" y="30" class="yellow text tiny">接近止盈1</text><text x="690" y="53" class="faint text tiny">21.60 减仓</text>
    </g>

    <g transform="translate(0 206)">
      <rect x="18" y="0" width="754" height="64" rx="12" fill="#0c1929"/>
      <text x="28" y="28" class="text small">诺德股份</text><text x="28" y="52" class="faint text tiny">sh.600110</text>
      <rect x="176" y="12" width="92" height="30" rx="15" class="chip-green"/><text x="194" y="33" class="green text tiny">舆情短线</text>
      <text x="302" y="29" class="text tiny num">12.21 / 12.10</text><text x="302" y="53" class="faint text tiny">止损 11.06</text>
      <text x="446" y="40" class="red text small num">-0.90%</text>
      <rect x="560" y="12" width="96" height="30" rx="15" class="chip"/><text x="578" y="33" class="cyan text tiny">等待确认</text>
      <text x="690" y="30" class="cyan text tiny">回到 12.96</text><text x="690" y="53" class="faint text tiny">转强再持</text>
    </g>

    <g transform="translate(0 280)">
      <rect x="18" y="0" width="754" height="64" rx="12" fill="#0c1929"/>
      <text x="28" y="28" class="text small">科大讯飞</text><text x="28" y="52" class="faint text tiny">sz.002230</text>
      <rect x="176" y="12" width="92" height="30" rx="15" class="chip-red"/><text x="196" y="33" class="red text tiny">不追高</text>
      <text x="302" y="29" class="text tiny num">50.02 / 40.61</text><text x="302" y="53" class="faint text tiny">MA20 下方</text>
      <text x="446" y="40" class="red text small num">-18.81%</text>
      <rect x="560" y="12" width="96" height="30" rx="15" class="chip-red"/><text x="578" y="33" class="red text tiny">信号失效</text>
      <text x="690" y="30" class="red text tiny">不补仓</text><text x="690" y="53" class="faint text tiny">等资金回流</text>
    </g>

    <g transform="translate(0 354)">
      <rect x="18" y="0" width="754" height="54" rx="12" fill="#0c1929"/>
      <text x="28" y="33" class="text small">城建发展</text>
      <rect x="176" y="12" width="92" height="30" rx="15" class="chip"/><text x="190" y="33" class="cyan text tiny">低波反转</text>
      <text x="302" y="33" class="text tiny num">4.94 / 4.40</text>
      <text x="446" y="33" class="red text small num">-10.93%</text>
      <rect x="560" y="12" width="96" height="30" rx="15" class="chip-red"/><text x="578" y="33" class="red text tiny">触发止损</text>
      <text x="690" y="33" class="red text tiny">减仓/退出</text>
    </g>
  </g>

  <g transform="translate(1110 274)">
    <rect class="panel" width="420" height="430" rx="18"/>
    <text x="24" y="43" class="text mid">宗申动力</text>
    <text x="175" y="43" class="muted text tiny">sz.001696 · 舆情短线</text>
    <rect x="24" y="64" width="156" height="38" rx="19" class="chip-green"/>
    <text x="46" y="89" class="green text tiny">继续持有</text>
    <rect x="192" y="64" width="158" height="38" rx="19" fill="#2f2410" stroke="#8a6416"/>
    <text x="216" y="89" class="yellow text tiny">接近止盈1</text>

    <g transform="translate(24 122)">
      <rect x="0" y="0" width="372" height="156" rx="14" fill="#091525" stroke="#20324e"/>
      <line x1="18" y1="36" x2="354" y2="36" class="grid"/>
      <line x1="18" y1="76" x2="354" y2="76" class="grid"/>
      <line x1="18" y1="116" x2="354" y2="116" class="grid"/>
      <polyline points="20,116 56,112 92,104 128,86 164,92 200,70 236,62 272,48 308,58 350,44" fill="none" stroke="#22c55e" stroke-width="4"/>
      <line x1="18" y1="55" x2="354" y2="55" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 7"/>
      <line x1="18" y1="126" x2="354" y2="126" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 7"/>
      <text x="236" y="31" class="yellow text tiny">止盈1 21.60</text>
      <text x="244" y="145" class="red text tiny">止损 18.32</text>
    </g>

    <g class="text tiny" transform="translate(24 306)">
      <text x="0" y="0" class="muted">成本价</text><text x="92" y="0" class="text num">19.04</text>
      <text x="206" y="0" class="muted">当前价</text><text x="294" y="0" class="green num">20.96</text>
      <text x="0" y="38" class="muted">持仓</text><text x="92" y="38" class="text num">3,000 股</text>
      <text x="206" y="38" class="muted">浮盈</text><text x="294" y="38" class="green num">+5,760</text>
      <text x="0" y="76" class="muted">止盈2</text><text x="92" y="76" class="text num">23.15</text>
      <text x="206" y="76" class="muted">移动止盈</text><text x="294" y="76" class="yellow num">20.25</text>
    </g>
  </g>

  <g transform="translate(292 730)">
    <rect class="panel" width="790" height="210" rx="18"/>
    <text x="24" y="43" class="text mid">AI 持仓建议</text>
    <text x="196" y="43" class="muted text tiny">DeepSeek 解释 · 本地规则先定价格位</text>
    <circle cx="34" cy="85" r="5" fill="#22c55e"/><text x="52" y="92" class="text small">舆情热度仍在，板块资金强于市场，持仓逻辑未失效。</text>
    <circle cx="34" cy="124" r="5" fill="#f59e0b"/><text x="52" y="131" class="text small">当前距离止盈1只差 3.1%，不建议追高加仓，优先等回踩。</text>
    <circle cx="34" cy="163" r="5" fill="#ef4444"/><text x="52" y="170" class="text small">若跌破 20.25 的移动止盈线，短线仓位降至半仓。</text>
  </g>

  <g transform="translate(1110 730)">
    <rect class="panel" width="420" height="210" rx="18"/>
    <text x="24" y="43" class="text mid">计划触发时间线</text>
    <line x1="52" y1="82" x2="52" y2="164" stroke="#29435f" stroke-width="4"/>
    <circle cx="52" cy="82" r="10" fill="#38bdf8"/><text x="76" y="89" class="text tiny">14:47 选股入选，生成买卖计划</text>
    <circle cx="52" cy="124" r="10" fill="#22c55e"/><text x="76" y="131" class="text tiny">15:01 触及入场区间，计划成交</text>
    <circle cx="52" cy="166" r="10" fill="#f59e0b"/><text x="76" y="173" class="text tiny">当前 接近止盈1，等待确认</text>
  </g>
</svg>
