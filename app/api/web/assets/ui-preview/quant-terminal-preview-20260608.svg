      <rect x="30" y="224" width="18" height="18" rx="3"/>
      <rect x="30" y="278" width="18" height="18" rx="3"/>
      <rect x="30" y="332" width="18" height="18" rx="3"/>
      <rect x="30" y="386" width="18" height="18" rx="3"/>
      <rect x="30" y="440" width="18" height="18" rx="3"/>
