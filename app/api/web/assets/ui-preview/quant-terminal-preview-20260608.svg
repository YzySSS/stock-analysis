          <text x="18" y="162">300750.SZ  宁德时代</text><text x="230" y="162">185.30</text><text x="410" y="162" class="red">168.45</text><text x="580" y="162">45d</text><text x="710" y="162" class="red">-9.09%</text><text x="900" y="162" class="red">EXITED</text>
          <text x="18" y="198">000858.SZ  五粮液</text><text x="230" y="198">152.10</text><text x="410" y="198">164.88</text><text x="580" y="198">8d</text><text x="710" y="198" class="blue">+8.40%</text><text x="900" y="198" class="blue">TRACKING</text>
        </g>
        <line x1="0" y1="104" x2="1210" y2="104" class="line"/>
