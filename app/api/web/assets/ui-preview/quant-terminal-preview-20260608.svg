<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-label="QuantTerminal 新版股票分析控制台 UI 预览图">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b414d"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171c25"/>
      <stop offset="1" stop-color="#0d121a"/>
    </linearGradient>
    <linearGradient id="blueArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#91b7ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#91b7ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <style>
      .bg { fill:#11161e; }
      .dot-bg { fill:url(#dots); opacity:.9; }
      .frame { fill:url(#screen); stroke:#7667ff; stroke-width:3; filter:url(#shadow); }
      .panel { fill:#171c25; stroke:#2d3543; stroke-width:1.5; }
      .panel2 { fill:#1b202b; stroke:#303948; stroke-width:1.5; }
      .line { stroke:#2d3543; stroke-width:1; }
      .text { fill:#f1f6ff; font-family:Inter, Arial, sans-serif; font-weight:800; }
      .muted { fill:#8d9aae; font-family:Inter, Arial, sans-serif; font-weight:700; }
      .tiny { font-size:13px; }
      .small { font-size:16px; }
      .mid { font-size:22px; }
      .big { font-size:34px; }
      .blue { fill:#91b7ff; }
      .green { fill:#31d786; }
      .red { fill:#ff7479; }
      .orange { fill:#ffb071; }
      .stroke-blue { stroke:#a9c7ff; }
      .stroke-muted { stroke:#485368; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <rect class="dot-bg" width="1600" height="1050"/>

  <text x="56" y="60" class="text mid">QuantTerminal 新版 UI 总览</text>
  <text x="56" y="88" class="muted small">Institutional dark terminal · dense metrics · thin border cards · stock-analysis redesign preview</text>
  <g transform="translate(1188 42)">
    <rect width="356" height="48" rx="6" class="panel"/>
    <text x="18" y="30" class="muted tiny">Beijing 14:30:05</text>
    <text x="162" y="30" class="green tiny">上证 +0.15%</text>
    <text x="258" y="30" class="blue tiny">Real-time</text>
  </g>

  <g transform="translate(56 122)">
    <rect width="1488" height="860" rx="10" class="frame"/>
    <rect width="232" height="860" rx="8" fill="#171c25"/>
    <line x1="232" y1="0" x2="232" y2="860" class="line"/>
    <text x="28" y="42" class="text small blue">QuantTerminal</text>
    <text x="28" y="64" class="muted tiny">Institutional Pro</text>
    <g class="text tiny">
      <text x="64" y="130">首页</text>
