<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Analysis Web</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>股票分析 Web 控制台</h1>
      <p>第一版内部网页，先打通策略、选股运行、结果跟踪。</p>
    </header>

    <section class="card">
      <h2>可用策略</h2>
      <button id="refresh-strategies">刷新策略列表</button>
      <div id="strategies"></div>
    </section>

    <section class="card">
      <h2>运行选股</h2>
      <form id="selection-form">
        <label>
          策略
          <select id="strategy-id"></select>
        </label>
        <label>
          股票池类型
          <select id="instrument-type">
            <option value="stock">stock</option>
            <option value="etf">etf</option>
            <option value="index">index</option>
          </select>
        </label>
        <label>
          数量限制
          <input id="limit" type="number" value="5" min="1" max="100" />
        </label>
        <button type="submit">运行并保存</button>
      </form>
      <pre id="selection-run-result"></pre>
    </section>

    <section class="card">
      <h2>选股结果跟踪</h2>
      <div class="actions">
        <button id="refresh-tracking">刷新跟踪结果</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>代码</th>
              <th>名称</th>
              <th>选股日期</th>
              <th>策略</th>
              <th>分数</th>
              <th>开盘价</th>
              <th>现价</th>
              <th>涨跌幅</th>
            </tr>
          </thead>
          <tbody id="tracking-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/static/app.js?v=20260612price"></script>
</body>
</html>
