server {
    listen 10.4.0.13:80;
    server_name www.yzysstock.cloud yzysstock.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        auth_basic off;
    }

    location / {
        return 503;
    }
}
