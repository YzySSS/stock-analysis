map "$request_method:$uri" $stock_analysis_heavy_limit_key {
    default "";
    "POST:/api/selection/run" $binary_remote_addr;
    "POST:/api/backtest/run" $binary_remote_addr;
    "POST:/api/tracking/deep-review" $binary_remote_addr;
    "POST:/api/portfolio/advice/outcomes/evaluate" $binary_remote_addr;
    ~^POST:/api/portfolio/[0-9]+/advice/refresh$ $binary_remote_addr;
}

limit_req_zone $stock_analysis_heavy_limit_key zone=stock_analysis_heavy:1m rate=6r/m;
